name: IndexNow na deploy

# Pingt IndexNow zodra een productie-deploy (Vercel/Netlify/Cloudflare via GitHub Deployments)
# succesvol is. Zet INDEXNOW_KEY als repository secret. De staat (.indexnow-state.json)
# wordt gecached zodat alleen nieuwe of gewijzigde URL's worden gemeld.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      all:
        description: 'Alle URL\'s opnieuw aanmelden'
        type: boolean
        default: false

jobs:
  ping:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .indexnow-state.json
          key: indexnow-state-${{ github.sha }}
          restore-keys: indexnow-state-
      - name: Build (voor actuele sitemap)
        run: npm run build:only
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      - name: IndexNow-ping
        run: node scripts/indexnow.mjs ${{ inputs.all && '--all' || '' }}
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
